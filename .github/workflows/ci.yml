name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, runner: ubuntu-24.04, os: linux, arch: x86_64 }
          - { name: macOS, runner: macos-14, os: macos, arch: arm64 }
          # The SDK is built with Visual Studio 2026 and the game must use the same compiler.
          - { name: Windows, runner: windows-2025-vs2026, os: windows, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          os: ${{ matrix.os }}
      - name: Package
        shell: bash
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" tools/package.py --bin build/bin/Release --version "ci-${GITHUB_SHA::7}" \
            --os ${{ matrix.os }} --arch ${{ matrix.arch }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wind-launcher-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  tools:
    name: Scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools -p "test_*.py"
